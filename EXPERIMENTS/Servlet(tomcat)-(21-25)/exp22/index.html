
<!DOCTYPE html>
<html>
<head>
    <title>Waste Management</title>
    <style>
        body {
            background-color: lightgreen;
            font-family: Arial;
            text-align: center;
        }
        form {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 20px;
        }
        input, select {
            margin: 8px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h2>Solid Waste Management</h2>

    <form action="WasteServlet" method="post">
        Name: <input type="text" name="name"><br>
        Address: <input type="text" name="address"><br>

        Waste Type:
        <select name="waste">
            <option>Plastic</option>
            <option>Food Waste</option>
            <option>Paper</option>
            <option>Other</option>
        </select><br>

        <input type="submit" value="Submit Request">
    </form>
</body>
</html>
