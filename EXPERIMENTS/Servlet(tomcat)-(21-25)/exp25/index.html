
<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Breakdown Assistance</title>
    <style>
        body {
            background-color: lightcyan;
            font-family: Arial;
            text-align: center;
        }
        form {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 20px;
        }
        input, textarea {
            margin: 8px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h2>On-Road Vehicle Assistance</h2>

    <form action="BreakdownServlet" method="post">
        Customer Name:
        <input type="text" name="name"><br>

        Vehicle Number:
        <input type="text" name="vehicle"><br>

        Location:
        <input type="text" name="location"><br>

        Problem:
        <textarea name="problem"></textarea><br>

        <input type="submit" value="Request Assistance">
    </form>
</body>
</html>
