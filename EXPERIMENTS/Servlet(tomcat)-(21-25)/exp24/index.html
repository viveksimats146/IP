
<!DOCTYPE html>
<html>
<head>
    <title>Wanderlust Travels</title>
    <style>
        body {
            background-color: lightyellow;
            font-family: Arial;
            text-align: center;
        }
        form {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 20px;
        }
        input, select {
            margin: 8px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h2>Wanderlust Travels</h2>

    <form action="TravelServlet" method="post">
        Customer Name:
        <input type="text" name="name"><br>

        Destination:
        <select name="destination">
            <option>Ooty</option>
            <option>Kodaikanal</option>
            <option>Chennai</option>
            <option>Kerala</option>
        </select><br>

        Travel Date:
        <input type="date" name="date"><br>

        <input type="submit" value="Book Now">
    </form>
</body>
</html>
