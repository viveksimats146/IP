
<!DOCTYPE html>
<html>
<head>
    <title>Blood Management</title>
    <style>
        body {
            background-color: pink;
            font-family: Arial;
            text-align: center;
        }
        form {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 20px;
        }
        input, select {
            margin: 8px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h2>Blood Donor Registration</h2>

    <form action="BloodServlet" method="post">
        Name: <input type="text" name="name"><br>
        Age: <input type="number" name="age"><br>

        Blood Group:
        <select name="group">
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select><br>

        Phone: <input type="text" name="phone"><br>
        <input type="submit" value="Register">
    </form>
</body>
</html>
