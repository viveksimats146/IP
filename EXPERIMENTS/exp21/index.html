
<!DOCTYPE html>
<html>
<head>
    <title>Job Application</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }
        form {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 20px;
        }
        input {
            margin: 8px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h2>Online Job Application</h2>

    <form action="JobServlet" method="post">
        Name: <input type="text" name="name"><br>
        Email: <input type="email" name="email"><br>
        Qualification: <input type="text" name="qualification"><br>
        Job Role: <input type="text" name="job"><br>
        <input type="submit" value="Apply">
    </form>
</body>
</html>
