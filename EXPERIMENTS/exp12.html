
<html>
<head>
<style>
body { text-align: center; font-family: Arial; background: #e3f2fd; }
h2 { color: navy; }
input, select, button { padding: 10px; margin: 5px; }
button { background: navy; color: white; }
</style>
</head>
<body>
<h2>InsureEasy Insurance</h2>

<input id="name" placeholder="Customer Name"><br>

<select id="policy">
<option>Health Insurance</option>
<option>Vehicle Insurance</option>
<option>Home Insurance</option>
</select><br>

<button onclick="submitPolicy()">Submit</button>

<p id="result"></p>

<script>
function submitPolicy() {
  let n = document.getElementById("name").value;
  let p = document.getElementById("policy").value;

  document.getElementById("result").innerHTML =
    "Policy selected by " + n + ": " + p;
}
</script>
</body>
</html>
