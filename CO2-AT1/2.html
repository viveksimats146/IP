<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .success {
            color: green;
        }
        button {
            margin-top: 20px;
            padding: 10px 18px;
        }
    </style>
</head>
<body>
    <h2>Student Registration</h2>
    <form id="registrationForm" novalidate>
        <label for="email">Email Address:</label>
        <input type="email" id="email" required>
        <span id="emailError" class="error" aria-live="polite"></span>
        <label for="phone">Phone Number (10 digits):</label>
        <input type="tel" id="phone" maxlength="10"
               inputmode="numeric" required>
        <span id="phoneError" class="error" aria-live="polite"></span>
        <br>
        <button type="submit">Register</button>
        <p id="result" aria-live="polite"></p>
    </form>
    <script>
        const form = document.getElementById("registrationForm");
        const email = document.getElementById("email");
        const phone = document.getElementById("phone");

        function validateEmail() {
            const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const valid = pattern.test(email.value.trim());

            document.getElementById("emailError").textContent =
                valid || email.value === ""
                ? ""
                : "Enter a valid email address.";
            return valid;
        }
        function validatePhone() {
            const pattern = /^\d{10}$/;
            const valid = pattern.test(phone.value.trim());
            document.getElementById("phoneError").textContent =
                valid || phone.value === ""
                ? ""
                : "Enter exactly 10 digits.";

            return valid;
        }
        email.addEventListener("input", validateEmail);
        phone.addEventListener("input", validatePhone);
        form.addEventListener("submit", function(event) {
            event.preventDefault();
            const emailValid = validateEmail();
            const phoneValid = validatePhone();
            const result = document.getElementById("result");
            if (!email.value.trim() || !phone.value.trim()) {
                result.textContent = "Please fill in all required fields.";
                result.className = "error";
            } else if (emailValid && phoneValid) {
                result.textContent = "Registration details are valid!";
                result.className = "success";
            } else {
                result.textContent = "Please correct the errors.";
                result.className = "error";
            }
        });
    </script>
</body>
</html>
