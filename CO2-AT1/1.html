
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Retail Website</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }
        header, footer {
            background: #234e70;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: #e3edf5;
            flex-wrap: wrap;
        }
        nav a {
            text-decoration: none;
            color: #234e70;
            font-weight: bold;
        }
        main {
            display: flex;
            gap: 20px;
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }
        .content, .sidebar {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .content {
            flex: 3;
        }
        .sidebar {
            flex: 1;
        }
        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }
        }
        @media (max-width: 480px) {
            header, footer {
                padding: 12px;
            }
            nav {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            main {
                padding: 10px;
                gap: 10px;
            }
            .content, .sidebar {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Smart Retail Store</h1>
        <p>Shop your favourite products</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#offers">Offers</a>
        <a href="#contact">Contact</a>
    </nav>
    <main id="home">
        <section class="content" id="products">
            <h2>Our Products</h2>
            <p>Explore electronics, clothing and household products.</p>
            <p>Our responsive layout adjusts to different screen sizes.</p>
        </section>

        <aside class="sidebar" id="offers">
            <h2>Special Offers</h2>
            <p>Discover our latest discounts and deals.</p>
        </aside>
    </main>
    <footer id="contact">
        <p>&copy; 2026 Smart Retail Store</p>
    </footer>
</body>
</html>
